name: Deploy staging

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  deployments: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build and deploy staging
    needs: test
    runs-on: ubuntu-latest
    environment: staging

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
      ECR_REPOSITORY: ripples-api
      ECS_CLUSTER: ripples-staging-cluster
      ECS_SERVICE: ripples-staging-api
      ECS_TASK_FAMILY: ripples-staging-api
      CONTAINER_NAME: ripples-api

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: staging-${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE_URI:$IMAGE_TAG" -t "$IMAGE_URI:staging" .
          docker push "$IMAGE_URI:$IMAGE_TAG"
          docker push "$IMAGE_URI:staging"
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          echo "image_uri=$IMAGE_URI@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Render and deploy task definition
        env:
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query 'taskDefinition')

          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$IMAGE_URI" \
            --arg NAME "$CONTAINER_NAME" '
              .containerDefinitions |= map(
                if .name == $NAME then .image = $IMAGE else . end
              )
              | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
            ')

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_ARN" \
            --force-new-deployment

      - name: Wait until the service is stable
        env:
          DEPLOY_ENVIRONMENT: staging
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
          HEALTH_PATH: /api/health
        run: bash .github/scripts/report-service-stability.sh
